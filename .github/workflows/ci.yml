name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly drift-check against main — catches dependency rot,
  # MCP-SDK breakage on newer Node releases, and other things a quiet
  # week would otherwise hide. Mondays at 09:00 UTC = before everyone's
  # workweek so a red badge is visible by Monday morning.
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
