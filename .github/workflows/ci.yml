name: CI

# pull_request only (CI-economy audit, 2026-08-12): the push trigger re-ran
# the identical, already-green commit after every merge. PR checks are the
# gate; merges are trusted. Deploy/release workflows trigger on their own
# push and run their own tests, so nothing here loses verification.
on:
  pull_request:
    branches: [main]
  # Weekly drift-check against main — catches dependency rot,
  # MCP-SDK breakage on newer Node releases, and other things a quiet
  # week would otherwise hide. Mondays at 09:00 UTC = before everyone's
  # workweek so a red badge is visible by Monday morning.
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Smoke-test the built binary. Catches shebang regressions, banner
      # mis-config, or any other failure that would ship a CLI that won't
      # start under `npx`. We shipped 0.1.0-next.0 with a duplicate shebang
      # and it broke for every install — this step is the guard.
      - name: Bin smoke test
        run: node dist/index.js --version

      # Catch version drift between package.json and server.json before
      # it reaches release.yml. Without this, a PR could merge with the
      # Registry record pointing at a non-existent npm tarball.
      - name: Version sync guard
        run: pnpm release:check
